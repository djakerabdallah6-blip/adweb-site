<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Démo site vitrine : un site qui remplit votre agenda · ADweb</title>
<meta name="description" content="Essayez un vrai site vitrine ADweb : version téléphone, bascule en arabe, prise de rendez-vous, espace gérant et statistiques.">
<meta name="theme-color" content="#070b18">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../demo.css">
<style>
body{background:#e9eef6}
/* Barre démo : bascule ordinateur / téléphone */
.dev{display:inline-flex;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:3px}
.dev button{border:0;background:none;color:#cfd8ee;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border-radius:999px;display:inline-flex;gap:6px;align-items:center}
.dev button.on{background:#fff;color:#070b18}
@media (max-width:700px){.dev{display:none}}

/* Scène */
.stage{transition:background .3s}
.stage.phone{padding:26px 12px 60px;background:radial-gradient(circle at 50% 0,#dbe4f3,#e9eef6 60%)}
#site{container-type:inline-size;container-name:site;background:#fff;color:#0b1020;font-family:var(--font);position:relative}
.stage.phone #site{width:390px;max-width:100%;height:min(800px,calc(100vh - 120px));margin:0 auto;overflow:auto;border:12px solid #0b1020;border-radius:46px;box-shadow:0 40px 90px -30px rgba(7,11,24,.55);scrollbar-width:none}
.stage.phone #site::-webkit-scrollbar{display:none}
#site[dir=rtl]{font-family:'Noto Kufi Arabic','Plus Jakarta Sans',system-ui,sans-serif}
#site[dir=rtl] .eb{letter-spacing:0}
.in{max-width:1160px;margin:0 auto;padding:0 24px}
.eb{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#0f766e;margin:0 0 12px}
h2.h{margin:0 0 14px;font-size:clamp(28px,4cqi,44px);line-height:1.08;letter-spacing:-.035em}
#site[dir=rtl] h2.h,#site[dir=rtl] h1{letter-spacing:0;line-height:1.35}
.lead{color:#4b5775;font-size:16px;line-height:1.65;margin:0;max-width:560px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;font-weight:700;font-size:15px;padding:14px 22px;min-height:50px;text-decoration:none;transition:transform .15s,background .2s}
.btn:active{transform:scale(.98)}
.btn.t{background:#0f766e;color:#fff;box-shadow:0 14px 30px -14px rgba(15,118,110,.8)}
.btn.t:hover{background:#0d5f59}
.btn.o{background:#fff;color:#0b1020;border:1.5px solid #d7e0ea}
.btn.wa{background:#22c55e;color:#fff}

/* Bandeau fermeture */
.closed{background:#b91c1c;color:#fff;text-align:center;font-size:14px;font-weight:600;padding:11px 16px;line-height:1.5;animation:slide .4s ease}
@keyframes slide{from{transform:translateY(-100%)}}
/* Navigation */
.nav{position:sticky;top:44px;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid #edf1f6}
.stage.phone .nav{top:0}
.nav .in{display:flex;align-items:center;justify-content:space-between;gap:14px;height:70px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo .mk{width:40px;height:40px;border-radius:12px;background:#0f766e;color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.logo b{display:block;font-size:15px;line-height:1.2}
.logo small{display:block;font-size:12px;color:#64748b;font-weight:600}
.links{display:flex;gap:24px;font-size:14px;font-weight:600;color:#334155}
.links a{text-decoration:none}
.navr{display:flex;align-items:center;gap:10px}
.lang{display:inline-flex;border:1.5px solid #d7e0ea;border-radius:999px;overflow:hidden}
.lang button{border:0;background:#fff;padding:7px 11px;font-size:13px;font-weight:700;color:#475569;min-height:36px}
.lang button.on{background:#0b1020;color:#fff}
.navr .btn{min-height:42px;padding:10px 18px;font-size:14px}
/* Hero */
.hero{background:linear-gradient(180deg,#f0fdfa,#fff);overflow:hidden}
.hero .in{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding-top:64px;padding-bottom:72px}
.live{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid #d9f2ec;border-radius:999px;padding:7px 14px 7px 10px;font-size:13px;font-weight:700;color:#0f5132;margin-bottom:20px}
.live i{width:9px;height:9px;border-radius:50%;background:#16a34a;box-shadow:0 0 0 0 rgba(22,163,74,.5);animation:lv 1.8s infinite}
.live.off{color:#991b1b;border-color:#fde2e2}.live.off i{background:#dc2626;animation:none}
@keyframes lv{to{box-shadow:0 0 0 8px rgba(22,163,74,0)}}
.hero h1{margin:0 0 18px;font-size:clamp(34px,5.4cqi,60px);line-height:1.02;letter-spacing:-.045em}
.hero h1 em{font-style:normal;color:#0f766e}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.trust{display:flex;gap:22px;margin-top:30px;flex-wrap:wrap}
.trust div{font-size:13px;color:#64748b;font-weight:600}
.trust b{display:block;font-size:22px;color:#0b1020;letter-spacing:-.02em}
.art{position:relative;aspect-ratio:1/1.05;border-radius:32px;background:linear-gradient(150deg,#14b8a6,#0f766e 60%,#134e4a);overflow:hidden;box-shadow:0 40px 80px -40px rgba(15,118,110,.7)}
.art svg{position:absolute;inset:0;width:100%;height:100%}
.art .tag{position:absolute;left:18px;bottom:18px;right:18px;background:rgba(255,255,255,.95);border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.art .tag .s{font-size:22px;color:#f59e0b;letter-spacing:2px}
.art .tag b{font-size:14px;display:block}.art .tag small{font-size:12px;color:#64748b;font-weight:600}
/* Sections */
.blk{padding:84px 0}
.blk.alt{background:#f6f9fc}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:36px}
.svc{border:1px solid #e6edf3;border-radius:22px;padding:24px;background:#fff;transition:transform .2s,box-shadow .2s}
.svc:hover{transform:translateY(-3px);box-shadow:0 24px 40px -30px rgba(15,23,42,.35)}
.svc .ic{width:46px;height:46px;border-radius:14px;background:#e6f6f3;color:#0f766e;display:flex;align-items:center;justify-content:center;margin-bottom:16px;font-size:22px}
.svc h3{margin:0 0 6px;font-size:18px;letter-spacing:-.02em}
.svc p{margin:0 0 14px;color:#64748b;font-size:14px;line-height:1.6}
.svc .pr{font-size:13px;font-weight:700;color:#0f766e;background:#f0fdfa;border-radius:999px;padding:6px 11px;display:inline-block;transition:background .4s}
.svc .pr.flash{background:#fde68a}
.rooms{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:14px;margin-top:36px}
.room{border-radius:22px;min-height:230px;position:relative;overflow:hidden;color:#fff;display:flex;align-items:flex-end;padding:18px}
.room span{position:relative;font-weight:700;font-size:14px;background:rgba(0,0,0,.28);backdrop-filter:blur(6px);padding:7px 12px;border-radius:999px}
.room svg{position:absolute;inset:0;width:100%;height:100%}
.revs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:36px}
.rev{background:#fff;border:1px solid #e6edf3;border-radius:22px;padding:22px}
.rev .s{color:#f59e0b;letter-spacing:2px;font-size:16px}
.rev p{font-size:14.5px;line-height:1.65;color:#334155;margin:10px 0 14px}
.rev b{font-size:13.5px}.rev small{color:#94a3b8;font-size:12px;font-weight:600;display:block}
/* Rendez-vous */
.rdv{display:grid;grid-template-columns:.9fr 1.1fr;gap:40px;align-items:start}
.rbox{background:#fff;border:1px solid #e6edf3;border-radius:26px;padding:24px;box-shadow:0 30px 60px -40px rgba(15,23,42,.35)}
.st2{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#94a3b8;margin:0 0 10px}
#site[dir=rtl] .st2{letter-spacing:0}
.ch2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.c2{border:1.5px solid #dbe4ec;background:#fff;border-radius:12px;padding:9px 13px;font-size:13.5px;font-weight:600;min-height:40px;transition:all .15s}
.c2:hover:not(:disabled){border-color:#0f766e}
.c2.on{background:#0f766e;border-color:#0f766e;color:#fff}
.c2:disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.day{display:flex;flex-direction:column;align-items:center;min-width:62px;line-height:1.2}
.day small{font-size:11px;font-weight:700;opacity:.75;text-transform:uppercase}
.day b{font-size:17px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.f2 input{border:1.5px solid #dbe4ec;border-radius:12px;padding:12px 14px;font-size:15px;min-height:48px;width:100%}
.f2 input:focus{outline:0;border-color:#0f766e}
.tf2{width:100%;border:1.5px dashed #9fd5cc;background:#f0fdfa;color:#0f5f58;border-radius:12px;padding:10px;font-size:13.5px;font-weight:700;margin-bottom:12px}
.rbox .btn{width:100%}
.er2{color:#b91c1c;font-size:13px;font-weight:600;margin:-4px 0 10px}
.sent{text-align:center;padding:26px 8px}
.sent .ck{width:68px;height:68px;border-radius:50%;margin:0 auto 16px;background:#dcfce7;color:#16a34a;display:flex;align-items:center;justify-content:center}
.sent h3{margin:0 0 8px;font-size:22px}
.sent p{margin:0;color:#64748b;line-height:1.6;font-size:14.5px}
.perk{display:grid;gap:12px;margin-top:26px}
.perk div{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;color:#334155;line-height:1.5}
.perk span{flex:none;width:30px;height:30px;border-radius:9px;background:#e6f6f3;color:#0f766e;display:flex;align-items:center;justify-content:center;font-size:15px}
/* Accès */
.acc{display:grid;grid-template-columns:1fr 1.2fr;gap:20px;margin-top:36px}
.hrs{background:#fff;border:1px solid #e6edf3;border-radius:22px;padding:8px 20px}
.hrs div{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f1f5f9;font-size:14.5px}
.hrs div:last-child{border-bottom:0}
.hrs div.today{font-weight:800;color:#0f766e}
.hrs div span:last-child{color:#475569}
.hrs div.today span:last-child{color:#0f766e}
.map{border-radius:22px;overflow:hidden;position:relative;min-height:280px;background:#e8f0ea}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.map .ad{position:absolute;left:14px;right:14px;bottom:14px;background:#fff;border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 12px 30px -16px rgba(0,0,0,.35)}
.map .ad b{font-size:14px;display:block}.map .ad small{font-size:12.5px;color:#64748b}
.map .ad .btn{min-height:40px;padding:9px 16px;font-size:13.5px}
.foot{background:#0b1020;color:#94a3b8;font-size:13px;padding:30px 0 40px}
.foot .in{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
/* Barre d'action mobile */
.mbar{display:none}
@container site (max-width:760px){
  .links{display:none}
  .hero .in{grid-template-columns:1fr;padding-top:36px;padding-bottom:44px;gap:30px}
  .art{aspect-ratio:1/.8}
  .grid3,.revs{grid-template-columns:1fr}
  .rooms{grid-template-columns:1fr 1fr}.rooms .room:first-child{grid-column:1/-1}
  .room{min-height:160px}
  .rdv,.acc{grid-template-columns:1fr;gap:24px}
  .blk{padding:56px 0}
  .in{padding:0 18px}
  .navr .btn{display:none}
  .logo small{display:none}
  .mbar{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px;position:sticky;bottom:0;z-index:31;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid #e6edf3;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
  .mbar .btn{min-height:46px;padding:10px 8px;font-size:13.5px}
  .slots{grid-template-columns:repeat(3,1fr)}
  .f2{grid-template-columns:1fr}
}

/* ---------- Espace gérant ---------- */
#admin{background:#f6f8fc;min-height:calc(100vh - 44px)}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
.ah{background:#fff;border-bottom:1px solid var(--line)}
.ah .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:16px}
.ah .t{display:flex;align-items:center;gap:12px}
.ah .t .lo{width:40px;height:40px;border-radius:12px;background:#0f766e;color:#fff;display:flex;align-items:center;justify-content:center}
.ah .t b{display:block;font-size:16px}.ah .t small{color:var(--soft);font-size:12.5px;font-weight:600}
.tabs{display:flex;gap:4px;margin-top:14px;overflow-x:auto}
.tab{border:0;background:none;padding:12px 16px;font-weight:700;font-size:14px;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap}
.tab.on{color:var(--blue);border-color:var(--blue)}
.tab .c{display:inline-flex;min-width:20px;height:20px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;align-items:center;justify-content:center;margin-left:6px;padding:0 5px}
.pane{padding:24px 20px 90px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.kpi small{font-size:12px;font-weight:700;color:var(--muted)}
.kpi b{display:block;font-size:28px;letter-spacing:-.03em;margin-top:6px}
.kpi em{font-style:normal;font-size:12px;color:var(--ok);font-weight:700}
.bar2{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.bar2 h2{margin:0;font-size:20px;letter-spacing:-.02em}
.req{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:10px;display:grid;grid-template-columns:1.2fr 1.3fr auto;gap:14px;align-items:center;transition:box-shadow .4s,border-color .4s}
.req.hot{border-color:var(--blue);box-shadow:0 0 0 4px rgba(37,99,235,.14)}
.req .who b{display:block;font-size:15px}
.req .who a{font-size:13px;color:var(--blue);font-weight:700;text-decoration:none}
.req .when{font-size:13.5px;color:var(--muted);line-height:1.5}
.req .when b{color:var(--ink)}
.req .acts{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:760px){.req{grid-template-columns:1fr}.req .acts{justify-content:flex-start}}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.p-new{background:#eaf0fe;color:#1d4ed8}.p-ok{background:var(--okt);color:#15803d}.p-move{background:var(--warnt);color:#b45309}
.sms{background:#0b1020;color:#e2e8f0;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5;margin-top:10px;grid-column:1/-1}
.sms b{color:#86efac}
.ed{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
@media (max-width:860px){.ed{grid-template-columns:1fr}}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}
.box h3{margin:0 0 4px;font-size:16px}
.box .d{margin:0 0 16px;color:var(--muted);font-size:13.5px;line-height:1.5}
.fl{display:grid;gap:6px;margin-bottom:14px}
.fl label{font-size:13px;font-weight:700}
.fl input,.fl textarea{border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;font-size:14.5px;width:100%;min-height:46px}
.fl textarea{min-height:70px;resize:vertical}
.tg{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px;border-radius:14px;background:#fff7f7;border:1.5px solid #fde2e2;margin-bottom:12px}
.tg b{font-size:14.5px;display:block}.tg small{font-size:12.5px;color:var(--muted)}
.sw2{position:relative;width:52px;height:30px;flex:none}
.sw2 input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.sw2 span{position:absolute;inset:0;border-radius:15px;background:#cbd5e1;transition:background .2s}
.sw2 span::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.sw2 input:checked+span{background:#dc2626}
.sw2 input:checked+span::after{transform:translateX(22px)}
.sw2 input:focus-visible+span{outline:3px solid #60a5fa;outline-offset:2px}
.hr{display:grid;grid-template-columns:90px 1fr 1fr auto;gap:8px;align-items:center;margin-bottom:8px;font-size:13.5px;font-weight:600}
.hr input[type=time]{border:1.5px solid var(--line);border-radius:10px;padding:8px;min-height:40px;width:100%}
.hr label{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.pr2{display:grid;grid-template-columns:1fr 120px;gap:8px;align-items:center;margin-bottom:8px;font-size:14px;font-weight:600}
.pr2 input{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;min-height:40px;width:100%;text-align:right}
.src{display:grid;gap:12px}
.src div{display:grid;grid-template-columns:1fr auto;gap:4px;font-size:13.5px}
.src span:last-child{font-weight:800}
.src i{grid-column:1/-1;height:7px;border-radius:4px;background:#eef2f9;display:block;overflow:hidden}
.src i u{display:block;height:100%;border-radius:4px;background:var(--blue)}
.serp{border:1px solid var(--line);border-radius:14px;padding:16px;font-family:Arial,sans-serif}
.serp .u{font-size:12.5px;color:#4d5156;display:flex;gap:8px;align-items:center}
.serp .u i{width:26px;height:26px;border-radius:50%;background:#e6f6f3;color:#0f766e;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px}
.serp .ti{font-size:19px;color:#1a0dab;margin:6px 0 4px;line-height:1.3}
.serp .ds{font-size:13.5px;color:#4d5156;line-height:1.55}
.serp .rt{font-size:13px;color:#70757a;margin-top:6px}
.serp .rt b{color:#e7711b;letter-spacing:1px}
.note{font-size:12.5px;color:var(--soft);margin-top:14px}
.chart{display:flex;align-items:flex-end;gap:6px;height:140px;margin-top:6px}
.chart div{flex:1;background:#bfd2fb;border-radius:6px 6px 2px 2px;position:relative}
.chart div:last-child{background:var(--blue)}
.chart div small{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:11px;color:var(--soft);font-weight:600}
</style>
</head>
<body>

<div class="dbar">
  <a href="../../#demos" aria-label="Retour au site ADweb"><span aria-hidden="true">←</span> AD<b>web</b> <span class="tag">· Démo · Site vitrine</span></a>
  <div class="dev" id="devToggle" role="group" aria-label="Aperçu">
    <button type="button" data-dev="desktop" class="on"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/></svg>Ordinateur</button>
    <button type="button" data-dev="phone"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg>Téléphone</button>
  </div>
  <button class="sw" id="sw" type="button">Espace gérant</button>
</div>

<div class="stage" id="stage">
  <div id="site" lang="fr" dir="ltr"></div>
</div>

<main id="admin" hidden>
