<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Démo boutique en ligne : de la vitrine au back-office · ADweb</title>
<meta name="description" content="Essayez une vraie boutique en ligne ADweb : commandez, recevez la notification, traitez la commande et gérez votre catalogue.">
<meta name="theme-color" content="#070b18">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../demo.css">
<style>
body{background:#faf7f2}
.serif{font-family:'Fraunces',Georgia,serif;letter-spacing:-.01em}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
/* En-tête boutique */
.sh{position:sticky;top:44px;z-index:40;background:rgba(250,247,242,.92);backdrop-filter:blur(10px);border-bottom:1px solid #ece4d8}
.sh .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px}
.brand{font-size:26px;font-weight:600;text-decoration:none;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--font);font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#9a7b4f}
.snav{display:flex;gap:26px;font-size:14px;font-weight:600;color:#5b5145}
.snav span{cursor:default}.snav span:first-child{color:#1c1712}
.cartb{position:relative;display:inline-flex;align-items:center;gap:8px;background:#1c1712;color:#fff;border:0;border-radius:999px;padding:10px 16px;font-size:14px;font-weight:700}
.cartb .n{min-width:22px;height:22px;border-radius:11px;background:#fff;color:#1c1712;font-size:12px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;transition:transform .3s}
.cartb .n.bump{transform:scale(1.35);background:#f6c56b}
@media (max-width:760px){.snav{display:none}}
.ribbon{background:#1c1712;color:#efe6d8;font-size:12.5px;font-weight:600;text-align:center;padding:9px 12px;letter-spacing:.02em}
.ribbon b{color:#f6c56b}
/* En-tête catalogue */
.ch{padding:40px 0 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.ch h1{margin:0;font-size:clamp(34px,5vw,54px);font-weight:600;line-height:1}
.ch p{margin:8px 0 0;color:#7a6c5c;font-size:14px}
/* Filtres */
.flt{display:grid;gap:10px;padding:14px;border:1px solid #ece4d8;border-radius:18px;background:#fff}
.frow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.frow .lb{width:92px;flex:none;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#9a8b78}
.chip{border:1px solid #e4dccf;background:#fff;border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:600;color:#3d342a;transition:all .15s;min-height:38px}
.chip:hover{border-color:#bfae96}
.chip.on{background:#1c1712;border-color:#1c1712;color:#fff}
.chip.new{animation:pop .5s ease}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.reset{margin-left:auto;background:none;border:0;font-size:13px;font-weight:700;color:#9a7b4f;text-decoration:underline;text-underline-offset:3px}
@media (max-width:640px){.frow .lb{width:100%}.reset{margin-left:0}}
/* Grille */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:18px;padding:22px 0 80px}
.pc{background:#fff;border:1px solid #ece4d8;border-radius:20px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s;animation:fade .4s ease both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}
.pc:hover{transform:translateY(-4px);box-shadow:0 24px 50px -30px rgba(60,40,10,.45)}
.pc .im{position:relative;aspect-ratio:1/1;background:#f4eee5}
.pc .im svg{width:100%;height:100%;display:block}
.pc .bd{position:absolute;top:12px;left:12px;background:#1c1712;color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:5px 9px;border-radius:7px}
.pc .bd.nw{background:#b45309}
.pc .tx{padding:14px 16px 18px}
.pc .mt{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#9a8b78}
.pc h3{margin:5px 0 6px;font-size:19px;font-weight:600}
.pc .pr{font-weight:800;font-size:15px}
.pc .pr small{font-weight:600;color:#9a8b78;font-size:12px}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:#7a6c5c}
/* Fenêtres */
.ov{position:fixed;inset:0;z-index:50;background:rgba(28,23,18,.5);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;animation:fd .2s}
@keyframes fd{from{opacity:0}}
.md{background:#fff;border-radius:24px;width:min(980px,100%);max-height:calc(100vh - 32px);overflow:auto;position:relative;box-shadow:0 40px 100px -30px rgba(0,0,0,.5)}
.mx{position:absolute;top:14px;right:14px;z-index:2;width:40px;height:40px;border-radius:50%;border:1px solid #ece4d8;background:#fff;font-size:16px}
.pd{display:grid;grid-template-columns:1.05fr 1fr;gap:0}
@media (max-width:760px){.pd{grid-template-columns:1fr}}
.gal{padding:18px;background:#f4eee5}
.gal .main{aspect-ratio:1/1;border-radius:18px;overflow:hidden;background:#efe7db}
.gal .main svg{width:100%;height:100%;display:block}
.thumbs{display:flex;gap:10px;margin-top:12px}
.thumbs button{width:74px;height:74px;border-radius:12px;overflow:hidden;border:2px solid transparent;padding:0;background:#efe7db}
.thumbs button.on{border-color:#1c1712}
.thumbs svg{width:100%;height:100%;display:block}
.inf{padding:30px 28px}
.inf .mt{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#9a8b78}
.inf h2{margin:6px 0 4px;font-size:34px;font-weight:600;line-height:1.05}
.inf .pr{font-size:22px;font-weight:800;margin:10px 0 14px}
.inf p{color:#5b5145;line-height:1.65;font-size:14.5px;margin:0 0 16px}
.notes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.notes span{font-size:12px;font-weight:600;background:#f4eee5;border-radius:999px;padding:5px 10px;color:#5b5145}
.lbl{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#9a8b78;margin:0 0 8px;display:flex;justify-content:space-between}
.sizes{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.sz{min-width:96px;border:1.5px solid #e4dccf;background:#fff;border-radius:14px;padding:10px 14px;text-align:left;transition:all .15s}
.sz b{display:block;font-size:15px}.sz small{font-size:12px;color:#7a6c5c;font-weight:600}
.sz:hover:not(:disabled){border-color:#1c1712}
.sz.on{border-color:#1c1712;background:#1c1712;color:#fff}.sz.on small{color:#e7dccb}
.sz:disabled{cursor:not-allowed;opacity:.45;background:repeating-linear-gradient(135deg,#fff,#fff 6px,#f4eee5 6px,#f4eee5 12px)}
.sz:disabled b{text-decoration:line-through}
.low{font-size:12.5px;font-weight:700;color:#b45309;min-height:18px;margin-bottom:16px}
.qty{display:inline-flex;align-items:center;border:1.5px solid #e4dccf;border-radius:999px;margin-right:10px}
.qty button{width:40px;height:44px;border:0;background:none;font-size:18px}
.qty span{min-width:22px;text-align:center;font-weight:700}
.addrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.b.gold{background:#1c1712;color:#fff;flex:1;min-width:200px;min-height:48px}
.b.gold:hover:not(:disabled){background:#000}
.perks{display:grid;gap:8px;margin-top:22px;padding-top:18px;border-top:1px solid #ece4d8;font-size:13px;color:#5b5145}
.perks div{display:flex;gap:10px;align-items:center}
/* Panier */
.drw{position:fixed;top:0;right:0;bottom:0;z-index:55;width:min(420px,100vw);background:#fff;box-shadow:-30px 0 80px -30px rgba(0,0,0,.4);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.drw.on{transform:none}
.drw .hd{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;border-bottom:1px solid #ece4d8}
.drw .hd h2{margin:0;font-size:24px;font-weight:600}
.drw .its{flex:1;overflow:auto;padding:8px 22px}
.it{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid #f1ebe2}
.it .th{width:72px;height:72px;flex:none;border-radius:12px;overflow:hidden;background:#f4eee5}
.it .th svg{width:100%;height:100%}
.it h4{margin:0 0 3px;font-size:16px;font-weight:600}
.it .s{font-size:13px;color:#7a6c5c}
.it .rm{background:none;border:0;color:#b45309;font-size:12.5px;font-weight:700;padding:0;margin-top:6px}
.it .p{margin-left:auto;font-weight:800;font-size:14px;white-space:nowrap}
.drw .ft{padding:18px 22px 22px;border-top:1px solid #ece4d8;background:#fbf8f3}
.tot{display:flex;justify-content:space-between;font-size:14px;color:#5b5145;margin-bottom:6px}
.tot.big{font-size:18px;color:#1c1712;font-weight:800;margin:10px 0 14px}
.drw .ft .b{width:100%;min-height:50px}
.scrim{position:fixed;inset:0;z-index:54;background:rgba(28,23,18,.35);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
/* Commande */
.co{width:min(560px,100%);padding:30px 28px}
.co h2{margin:0 0 4px;font-size:30px;font-weight:600}
.co .sub{color:#7a6c5c;font-size:14px;margin:0 0 20px}
.fld{display:grid;gap:6px;margin-bottom:14px}
.fld label{font-size:13px;font-weight:700}
.fld input,.fld select{border:1.5px solid #e4dccf;border-radius:12px;padding:12px 14px;font-size:15px;background:#fff;min-height:48px;width:100%}
.fld input:focus,.fld select:focus{outline:0;border-color:#1c1712}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.mode{border:1.5px solid #e4dccf;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.mode input{margin-top:3px;accent-color:#1c1712}
.mode b{display:block;font-size:14px}.mode small{color:#7a6c5c;font-size:12.5px}
.mode:has(input:checked){border-color:#1c1712;background:#fbf8f3}
.testfill{width:100%;border:1.5px dashed #c9b89f;background:#fbf8f3;color:#5b5145;border-radius:12px;padding:11px;font-size:13.5px;font-weight:700;margin-bottom:16px}
.sum{background:#fbf8f3;border-radius:14px;padding:14px 16px;margin:4px 0 16px}
.cod{display:flex;gap:10px;align-items:center;font-size:13px;color:#5b5145;margin-bottom:16px}
.ok{text-align:center;padding:12px 0}
.ok .ck{width:72px;height:72px;margin:0 auto 18px;border-radius:50%;background:#e8f7ee;color:#16a34a;display:flex;align-items:center;justify-content:center}
.ok .ck svg{animation:dr .6s ease .1s both}
@keyframes dr{from{transform:scale(.3);opacity:0}}
.err{color:#b91c1c;font-size:12.5px;font-weight:600}

/* ---------- Administration ---------- */
#admin{background:#f6f8fc;min-height:calc(100vh - 44px)}
.ah{background:#fff;border-bottom:1px solid var(--line)}
.ah .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:16px}
.ah .t{display:flex;align-items:center;gap:12px}
.ah .t .lo{width:40px;height:40px;border-radius:12px;background:#1c1712;color:#f6c56b;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:20px}
.ah .t b{display:block;font-size:16px}.ah .t small{color:var(--soft);font-size:12.5px;font-weight:600}
.tabs{display:flex;gap:4px;margin-top:14px;overflow-x:auto}
.tab{border:0;background:none;padding:12px 16px;font-weight:700;font-size:14px;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap}
.tab.on{color:var(--blue);border-color:var(--blue)}
.tab .c{display:inline-flex;min-width:20px;height:20px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;align-items:center;justify-content:center;margin-left:6px;padding:0 5px}
.pane{padding:24px 0 80px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.kpi small{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--muted)}
.kpi small i{width:8px;height:8px;border-radius:50%}
.kpi b{display:block;font-size:28px;letter-spacing:-.03em;margin-top:6px;transition:color .3s}
.kpi b.flash{color:var(--blue)}
.kpi em{font-style:normal;font-size:12px;color:var(--ok);font-weight:700}
.bar2{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.bar2 h2{margin:0;font-size:20px;letter-spacing:-.02em}
.ord{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:10px;display:grid;grid-template-columns:1.3fr 1.4fr .8fr auto;gap:14px;align-items:center;transition:box-shadow .4s,border-color .4s}
.ord.hot{border-color:var(--blue);box-shadow:0 0 0 4px rgba(37,99,235,.14)}
@media (max-width:820px){.ord{grid-template-columns:1fr 1fr}.ord .acts{grid-column:1/-1}}
.ord .who b{display:block;font-size:15px}
.ord .who a{font-size:13px;color:var(--blue);font-weight:700;text-decoration:none}
.ord .who small{display:block;color:var(--soft);font-size:12px;font-weight:600;margin-top:2px}
.ord .what{font-size:13.5px;color:var(--muted);line-height:1.5}
.ord .what b{color:var(--ink)}
.ord .amt{font-weight:800;font-size:15px}
.ord .acts{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.s-nouvelle{background:#eaf0fe;color:#1d4ed8}.s-appelee{background:var(--warnt);color:#b45309}.s-confirmee{background:#f3e8ff;color:#7e22ce}.s-livree{background:var(--okt);color:#15803d}.s-annulee{background:#f1f5f9;color:#64748b}
.prow{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center}
.prow .th{width:64px;height:64px;border-radius:12px;overflow:hidden;background:#f4eee5}
.prow .th svg{width:100%;height:100%}
.prow b{font-size:15px}.prow small{display:block;color:var(--soft);font-size:12.5px;font-weight:600;margin:2px 0 6px}
.vars{display:flex;gap:6px;flex-wrap:wrap}
.vars span{font-size:12px;font-weight:700;background:#f1f5fb;border-radius:8px;padding:4px 8px;color:var(--muted)}
.vars span.z{background:var(--badt);color:var(--bad)}
.vars span.l{background:var(--warnt);color:#b45309}
.prow .acts{display:flex;gap:8px}
@media (max-width:640px){.prow{grid-template-columns:56px 1fr}.prow .acts{grid-column:1/-1}}
.af{width:min(560px,100%);padding:28px}
.af h2{margin:0 0 18px;font-size:22px;letter-spacing:-.02em}
.af .fld input,.af .fld select{border-color:var(--line);border-radius:12px}
.vt{display:grid;grid-template-columns:80px 1fr 1fr;gap:8px;align-items:center;margin-bottom:8px}
.vt input{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.vt span{font-weight:700;font-size:14px}
.vh{display:grid;grid-template-columns:80px 1fr 1fr;gap:8px;font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin-bottom:6px}
.cards2{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}
@media (max-width:820px){.cards2{grid-template-columns:1fr}}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}
.box h3{margin:0 0 14px;font-size:15px}
.rk{display:grid;gap:10px}
.rk div{display:grid;grid-template-columns:1fr auto;gap:4px;font-size:13.5px}
.rk div span:last-child{font-weight:800}
.rk i{grid-column:1/-1;height:6px;border-radius:3px;background:#eef2f9;overflow:hidden;display:block}
.rk i u{display:block;height:100%;background:var(--blue);border-radius:3px}
.note{font-size:12.5px;color:var(--soft);margin-top:14px}
</style>
</head>
<body>

<div class="dbar">
  <a href="../../#demos" aria-label="Retour au site ADweb"><span aria-hidden="true">←</span> AD<b>web</b> <span class="tag">· Démo · Boutique en ligne</span></a>
  <button class="sw" id="sw" type="button">Voir l’admin</button>
</div>

<!-- ===== BOUTIQUE ===== -->
<main id="shop">
  <header class="sh">
    <div class="wrap">
      <a class="brand serif" href="#" onclick="return false">Yasmine <small>Parfums</small></a>
      <nav class="snav" aria-label="Boutique"><span>Boutique</span><span>Nouveautés</span><span>Coffrets</span><span>Contact</span></nav>
      <button class="cartb" id="cartBtn" type="button" aria-label="Ouvrir le panier">Panier <span class="n" id="cc">0</span></button>
    </div>
  </header>
  <div class="ribbon">Livraison dans les <b>58 wilayas</b> · Paiement à la livraison · Échange sous 7 jours</div>
  <div class="wrap">
    <div class="ch">
      <div>
        <h1 class="serif">Parfums &amp; muscs</h1>
        <p id="count"></p>
      </div>
    </div>
    <div class="flt" id="filters"></div>
    <div class="grid" id="grid"></div>
  </div>
</main>

<!-- Fiche produit -->
<div class="ov" id="pm" hidden></div>

<!-- Panier -->
<div class="scrim" id="scrim"></div>
<aside class="drw" id="cart" aria-label="Panier" aria-hidden="true">
  <div class="hd"><h2 class="serif">Votre panier</h2><button class="mx" style="position:static" id="cartX" type="button" aria-label="Fermer le panier">✕</button></div>
  <div class="its" id="cartItems"></div>
  <div class="ft" id="cartFoot"></div>
</aside>

<!-- Commande -->
<div class="ov" id="checkout" hidden></div>

<!-- ===== ADMINISTRATION ===== -->
<main id="admin" hidden>
  <div class="ah">
    <div class="wrap">
      <div class="t"><span class="lo">Y</span><div><b>Yasmine Parfums</b><small>Administration</small></div></div>
      <button class="b sec sm" id="backShop" type="button">← Retour à la boutique</button>
    </div>
    <div class="wrap">
      <div class="tabs" role="tablist">
        <button class="tab on" data-tab="orders" type="button" role="tab">Commandes<span class="c" id="newCount" hidden>0</span></button>
        <button class="tab" data-tab="products" type="button" role="tab">Produits</button>
        <button class="tab" data-tab="stats" type="button" role="tab">Statistiques</button>
      </div>
    </div>
  </div>
  <div class="wrap pane" id="pane"></div>
</main>
<div class="ov" id="aform" hidden></div>

<button class="notif" id="notif" type="button" aria-live="assertive"></button>
<div class="toast" id="toast" role="status"></div>

<script src="../tour.js"></script>
<script src="ecom.js"></script>
</body>
</html>
